# Выпуск лицензии ФАЙЛОМ — только для кассы без интернета. Кассе с
# интернетом код активации выдаётся в панели (там же продление и отзыв);
# сюда лезть незачем. Скрипт заодно заводит строку в licenses, иначе
# выпущенная лицензия не видна в панели и неуправляема.
name: Выпустить лицензию файлом (касса без интернета)

on:
  workflow_dispatch:
    inputs:
      customer:
        description: 'Клиент (название кафе)'
        required: true
      machine:
        description: 'Код компьютера из приложения (пусто = без привязки)'
        required: false
        default: ''
      days:
        description: 'Срок действия, дней (0 = бессрочно)'
        required: false
        default: '365'
      terminals:
        description: 'Лимит касс'
        required: false
        default: '1'

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Выпуск лицензии
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CUSTOMER: ${{ inputs.customer }}
          MACHINE: ${{ inputs.machine }}
          DAYS: ${{ inputs.days }}
          TERMINALS: ${{ inputs.terminals }}
        run: node tools/license-issue.mjs
      - name: Загрузка .lic как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: license
          path: out/*.lic
          retention-days: 7
