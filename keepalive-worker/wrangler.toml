# Крошечный Worker-будильник панели. Делает два дела:
#   • раз в день дёргает /api/keepalive, чтобы оба бесплатных Supabase-проекта
#     (лицензии + монитор) не заснули от 7 дней неактивности;
#   • утром дёргает /api/cron/daily — отчёты владельцу в Telegram (лицензии на
#     контроль, воронка триалов).
# В отличие от cron GitHub Actions, cron-триггер Cloudflare не отключается за
# неактивность репозитория — тикает, пока существует аккаунт. Ровно поэтому
# отчёты и переехали сюда из Actions.
#
# Секрет: PANEL_PASSWORD (`wrangler secret put PANEL_PASSWORD`) — /api/cron/daily
# закрыт паролем панели, иначе слать владельцу в Telegram мог бы кто угодно.
name = "imag-keepalive"
main = "src/index.mjs"
compatibility_date = "2026-07-01"

[vars]
PANEL_URL = "https://imag-license-panel.pages.dev"

[triggers]
# 47 15 — пинг (минуты смещены относительно GitHub-пинга 03:17 UTC — два
#          независимых пинга в день).
# 0 4    — ежедневные отчёты, 09:00 по Алматы. Какое расписание сработало,
#          Worker различает по event.cron (см. index.mjs).
crons = ["47 15 * * *", "0 4 * * *"]
