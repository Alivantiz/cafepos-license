<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>iMag — панель</title>
    <!-- iOS шлёт push только приложению с домашнего экрана: закладка Safari
         уведомления получать не может в принципе. Отсюда манифест, иконка
         apple-touch-icon (SVG iOS тут не понимает) и service worker. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- Цвет системной строки. Без status-bar-style=black-translucent: с ним
         страница уезжает ПОД часы и значок связи, и шапка оказывалась под
         ними. Цвет подменяется под тему в App.jsx. -->
    <meta name="theme-color" content="#0e1013" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="iMag" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
